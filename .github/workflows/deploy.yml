name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm" }
      - run: npm ci
      - run: npm test
      # PATH_PREFIX is set so absolute-path assets resolve under the
      # project-site URL (https://<user>.github.io/<repo>/). Remove this
      # env once the custom domain (src/CNAME) is verified and DNS is live —
      # a custom-domain site serves from "/" and PATH_PREFIX would break it.
      - run: npm run build
        env:
          PATH_PREFIX: /shaolin-hung-gar-kung-fu/
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
